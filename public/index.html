<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Harvest Guard</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    background: #faf6ec;
    color: #1f2a1f;
  }
  h1 { color: #1c4d2e; }
  textarea {
    width: 100%;
    height: 80px;
    padding: 10px;
    font-size: 15px;
    border: 1px solid #1c4d2e;
    border-radius: 6px;
    box-sizing: border-box;
  }
  button {
    margin-top: 10px;
    background: #1c4d2e;
    color: #f4e9c9;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #response {
    margin-top: 20px;
    padding: 15px;
    background: white;
    border-left: 4px solid #c9a227;
    border-radius: 4px;
    white-space: pre-wrap;
    display: none;
  }
</style>
</head>
<body>
  <h1>Harvest Guard</h1>
  <p>Describe your harvest situation, and Gemma will give post-harvest handling advice.</p>

  <textarea id="message" placeholder="e.g. I harvested 100kg of tomatoes yesterday, it's been raining, market day is in 3 days"></textarea>
  <br />
  <button id="submitBtn">Ask Gemma</button>

  <div id="response"></div>

  <script>
    const btn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");
    const responseBox = document.getElementById("response");

    btn.addEventListener("click", async () => {
      const farmerMessage = messageBox.value.trim();
      if (!farmerMessage) return;

      btn.disabled = true;
      btn.textContent = "Thinking...";
      responseBox.style.display = "block";
      responseBox.textContent = "Waiting for Gemma...";

      try {
        const res = await fetch("/api/advise", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ farmerMessage }),
        });
        const data = await res.json();

        if (!res.ok) {
          responseBox.textContent = "Error: " + (data.error || "unknown error");
        } else {
          responseBox.textContent = data.advice;
        }
      } catch (err) {
        responseBox.textContent = "Request failed: " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Ask Gemma";
      }
    });
  </script>
</body>
</html>
