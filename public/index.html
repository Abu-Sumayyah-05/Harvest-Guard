<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Harvest Guard</title>
<style>
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    max-width: 640px;
    margin: 50px auto;
    padding: 0 20px;
    background: linear-gradient(135deg, #faf6ec 0%, #f0ead6 100%);
    color: #1f2a1f;
  }
  h1 {
    color: #1c4d2e;
    font-size: 2.2em;
    margin-bottom: 5px;
    border-bottom: 3px solid #c9a227;
    padding-bottom: 10px;
    display: inline-block;
  }
  p { color: #4a5a4a; font-size: 1.05em; }
  textarea {
    width: 100%;
    height: 90px;
    padding: 14px;
    font-size: 15px;
    border: 2px solid #1c4d2e;
    border-radius: 10px;
    box-sizing: border-box;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus {
    outline: none;
    border-color: #c9a227;
    box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.2);
  }
  button {
    margin-top: 14px;
    background: #1c4d2e;
    color: #f4e9c9;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #143a22; transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #response {
    margin-top: 24px;
    padding: 20px;
    background: white;
    border-left: 5px solid #c9a227;
    border-radius: 8px;
    white-space: pre-wrap;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>Harvest Guard</h1>
  <p>Describe your harvest situation, and Gemma will give post-harvest handling advice.</p>

  <textarea id="message" placeholder="e.g. I harvested 100kg of tomatoes yesterday, it's been raining, market day is in 3 days"></textarea>
  <br />
  <button id="submitBtn">Ask Gemma</button>

  <div id="response"></div>

  <script>
    const btn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");
    const responseBox = document.getElementById("response");

    btn.addEventListener("click", async () => {
      const farmerMessage = messageBox.value.trim();
      if (!farmerMessage) return;

      btn.disabled = true;
      btn.textContent = "Thinking...";
      responseBox.style.display = "block";
      responseBox.textContent = "Waiting for Gemma...";

      try {
        const res = await fetch("/api/advise", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ farmerMessage }),
        });
        const data = await res.json();

        if (!res.ok) {
          responseBox.textContent = "Error: " + (data.error || "unknown error");
        } else {
          responseBox.textContent = data.advice;
        }
      } catch (err) {
        responseBox.textContent = "Request failed: " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Ask Gemma";
      }
    });
  </script>
</body>
</html>
